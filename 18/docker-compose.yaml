services:
  mysql:
    image: mysql:8.4
    container_name: tea-mysql
    environment:
      MYSQL_ROOT_PASSWORD: NotSensitive
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init_mysql:/docker-entrypoint-initdb.d
  app:
    build: .
    container_name: tea-python
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_NAME: tea_db
      DB_USER: root
      DB_PASSWORD: NotSensitive

volumes:
  db_data:
