services:
  mysql:
    image: mysql:8.4
    container_name: tea_mysql
    environment:
      MYSQL_ROOT_PASSWORD: NotSensitive
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - ./init_mysql:/docker-entrypoint-initdb.d 
  app:
    build: .
    container_name: tea-python
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: tea_db
      DB_USER: tea_user
      DB_PASSWORD: tea_pass
    command: python populate.py

volumes:
  db_data:
